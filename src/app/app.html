<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/" aria-label="Openstay home">
    <img
      class="brand-logo"
      src="/logo-primary-COQDrkLb.png"
      alt=""
      width="963"
      height="259"
    />
    <span class="visually-hidden">Openstay</span>
  </a>
  <nav class="main-nav" aria-label="Primary navigation">
    <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a mat-button routerLink="/explore" routerLinkActive="active">Explore</a>
    <a mat-button class="signin-link" routerLink="/auth/login">Sign in</a>
    <a mat-flat-button class="join-link" routerLink="/auth/register">Join Openstay</a>
  </nav>
</mat-toolbar>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <span>Openstay</span>
  <span>Stay local. Connect globally.</span>
</footer>
